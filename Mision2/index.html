<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Busca libros, descubre sus portadas y ordénalos por año o título." />
    <title>LibroRadar | Misión 2</title>
    <link rel="stylesheet" href="./src/style.css" />
    <script type="module" src="./src/main.js"></script>
  </head>
  <body>
    <main class="contenedor">
      <header class="cabecera">
        <p class="etiqueta">MISIÓN 2 · JAVASCRIPT AVANZADO</p>
        <h1>Libro<span>Radar</span></h1>
        <p class="descripcion">Una pequeña biblioteca para descubrir tu próxima lectura.</p>

        <form id="buscador">
          <label for="consulta">Busca por título o autor</label>
          <div class="fila">
            <input id="consulta" type="search" value="javascript" placeholder="Por ejemplo: Dune" required />
            <button id="boton" type="submit">Buscar libros</button>
          </div>
        </form>
      </header>

      <section class="seccion-resultados" aria-label="Resultados de búsqueda">
        <div class="barra-resultados">
          <div>
            <p id="estado" role="status" aria-live="polite">Inicia la aplicación con npm run dev.</p>
            <p id="resumen"></p>
            <button id="reintentar" class="secundario" type="button" hidden>Reintentar búsqueda</button>
          </div>
          <div class="control-orden">
            <label for="orden">Ordenar resultados</label>
            <select id="orden" disabled>
              <option value="relevancia">Relevancia</option>
              <option value="recientes">Más recientes primero</option>
              <option value="titulo">Título A–Z</option>
            </select>
          </div>
        </div>
        <ul id="resultados" aria-label="Libros encontrados"></ul>
      </section>
      <footer>Datos de <a href="https://openlibrary.org/" target="_blank" rel="noopener noreferrer">Open Library</a>. Las búsquedas se guardan durante 24 horas en este navegador.</footer>
    </main>
  </body>
</html>
